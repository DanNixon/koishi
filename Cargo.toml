[package]
name = "koishi-pw"
version = "0.2.1"
license = "MIT"
edition = "2024"
homepage = "https://github.com/DanNixon/koishi"
repository = "https://github.com/DanNixon/koishi"
readme = "README.md"
description = "Password manager build around SOPS"

[[bin]]
name = "koishi"
path = "./src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["cargo", "derive", "env", "string"] }
clap_complete = { version = "4.6.0", features = ["unstable-dynamic"] }
gix = { version = "0.85.0", default-features = false, features = ["sha1"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
miette = { version = "7.6.0", features = ["fancy"] }
qrcode = "0.14.1"
saphyr = "0.0.6"
serde_json = "1.0.149"
shellexpand = { version = "3.1.2", features = ["path"] }
skim = "4.7.0"
strum = "0.28.0"
strum_macros = "0.28.0"
totp-rs = { version = "5.7.1", features = ["zeroize", "otpauth"] }
walkdir = "2.5.0"
wl-clipboard-rs = "0.9.3"
zeroize = "1.8.2"

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3.24.0"

[lints.rust]
# https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html
unsafe_code = "deny"
unused_results = "warn"

[lints.clippy]
# https://rust-lang.github.io/rust-clippy/stable/index.html
panic = "deny"
